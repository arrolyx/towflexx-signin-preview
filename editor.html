<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Entra Branding Prototype</title>
<link id="fav" rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif}
body{display:flex;background:#e9e9e9;overflow:hidden}
#panel{width:340px;min-width:340px;height:100%;overflow:auto;background:#1f1f1f;color:#eee;padding:44px 14px 12px;font-size:12.5px;transition:margin .2s}
#panel.hidden{margin-left:-340px}
#panel h2{font-size:15px;margin:0 0 6px}#panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9ab;margin:16px 0 6px;border-top:1px solid #333;padding-top:10px}
#panel label{display:block;margin:6px 0 2px}#panel input[type=text],#panel textarea,#panel select{width:100%;background:#2b2b2b;color:#eee;border:1px solid #444;padding:5px;font:inherit;border-radius:3px}
#panel textarea{height:120px;resize:vertical}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{background:#262626;border:1px solid #333;padding:6px;margin:5px 0;border-radius:4px}.up b{display:block}.up input{max-width:220px}.meta{font-size:11px;color:#8c8}.meta.bad{color:#ff6b6b}
#panel button{background:#3a3a3a;color:#eee;border:1px solid #555;padding:4px 8px;border-radius:3px;cursor:pointer;font:inherit}
#panel button.pri{background:#0067b8;border-color:#0067b8}
.draft{background:#7a5b00;color:#fff;font-size:10px;padding:1px 5px;border-radius:2px;margin-left:4px}
#toggle{position:absolute;top:8px;left:8px;z-index:10;background:#0067b8;color:#fff;border:0;padding:6px 10px;border-radius:3px;cursor:pointer}
#stage{flex:1;position:relative;overflow:hidden}
#scaler{position:absolute;left:50%;top:50%;transform-origin:0 0;box-shadow:0 4px 30px rgba(0,0,0,.3)}
#vplabel{position:absolute;bottom:6px;right:10px;font-size:11px;color:#666}
/* ===== Mock sign-in page ===== */
#page{position:relative;overflow:hidden;background:#f2f2f2 center/cover no-repeat;color:#1b1b1b;font-size:15px;line-height:1.4}
#page .bgdefault{position:absolute;inset:0;background:radial-gradient(circle at 15% 85%,#c9e2f5 0,transparent 45%),radial-gradient(circle at 85% 15%,#e6dcef 0,transparent 45%),#f2f2f2}
#hdr{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;padding:0 24px;z-index:3}
#hdr img{max-width:245px;max-height:36px}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
#page.partial #wrap{left:auto;width:min(100%,640px);background:#fff}
#page.partial .card{box-shadow:none}
.card{width:440px;max-width:calc(100% - 40px);background:#fff;padding:44px;box-shadow:0 2px 6px rgba(0,0,0,.2);min-height:338px;margin-bottom:28px}
.card .banner{height:24px;margin-bottom:16px;display:block}.card img.banner{height:auto;max-height:36px;max-width:245px}
.title{font-size:24px;font-weight:600;line-height:28px;margin:0 0 12px}
.ms-in{width:100%;border:0;border-bottom:1px solid #666;padding:6px 0;font:inherit;font-size:15px;outline:none;background:transparent;color:inherit;margin-bottom:16px;height:36px}
.ms-in:focus{border-bottom-color:#0067b8}
.lnk{color:#0067b8;font-size:13px;text-decoration:none;display:block;margin:0 0 16px}
.btns{display:flex;justify-content:flex-end;gap:4px;margin-top:24px}
.btn{min-width:108px;height:32px;border:0;font:inherit;font-size:15px;padding:4px 12px;cursor:pointer}
.btn.p{background:#0067b8;color:#fff}
.ptext{font-size:13px;margin-top:20px;word-wrap:break-word}.ptext p{margin:0 0 8px}.ptext a{color:#0067b8}
.ident{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:12px}.ident .bk{font-size:18px;cursor:pointer;color:#666}
.tile{display:flex;align-items:center;gap:12px;margin-top:20px;padding:10px;border:1px solid #e5e5e5}.tile img,.tile .ph{width:48px;height:48px;object-fit:contain}
.tile .ph{background:#ddd}
#ftr{position:absolute;bottom:0;right:0;left:0;height:28px;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:0 16px;font-size:12px;z-index:4;background:rgba(0,0,0,.6);color:#fff}
#page.dark .card,#page.dark.partial #wrap{background:#1b1b1b;color:#fff}#page.dark .ms-in{border-bottom-color:#aaa}#page.dark .lnk,#page.dark .ptext a{color:#4cb3ff}#page.dark .tile{border-color:#333}#page.dark .card svg text{fill:#fff}
#page.mobile .card{box-shadow:none;width:100%;max-width:100%;padding:24px;min-height:100%;margin:0}#page.mobile #wrap{align-items:flex-start;background:#fff}#page.mobile.dark #wrap{background:#1b1b1b}
</style></head><body>
<button id="toggle" onclick="panel.classList.toggle('hidden');fit()">☰ Panel</button>
<aside id="panel"><h2>Entra Branding Preview</h2>
<div class="row"><button class="pri" onclick="applyPreset(PRESET)">Load TowFLEXX preset</button><button onclick="applyPreset(MS)">Reset to Microsoft default</button></div>
<h3>Assets</h3><div id="uploads"></div>
<h3>Layout</h3>
<label>Page background color</label><div class="row"><input type="color" id="bgColor"><span id="bgHex"></span></div>
<label>Template</label><select id="template"><option value="full">Full-screen background</option><option value="partial">Partial-screen background</option></select>
<div class="row" style="margin-top:6px"><label><input type="checkbox" id="showHeader"> Show header</label><label><input type="checkbox" id="showFooter"> Show footer</label></div>
<label>Viewport</label><select id="viewport"><option value="1920x1080">Desktop 1920×1080</option><option value="1366x768">Laptop 1366×768</option><option value="768x1024">Tablet 768×1024</option><option value="390x844">Mobile 390×844</option></select>
<label>Browser theme</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
<label>Step</label><select id="step"><option value="1">1 · Username</option><option value="2">2 · Password + account tile</option></select>
<label>Account tile square logo</label><select id="sqMode"><option value="light">Light</option><option value="dark">Dark</option></select>
<h3>Text</h3>
<label>Username hint text <span class="draft" id="d1">DRAFT</span></label><input type="text" id="hint" maxlength="64">
<label>Sign-in page text <span id="cnt"></span> <span class="draft" id="d2">DRAFT</span></label><textarea id="ptext" maxlength="1024"></textarea>
<div style="font-size:11px;color:#999">**bold** __bold__ *italic* _italic_ ++underline++ [text](url); blank line = new paragraph</div>
<label><input type="checkbox" id="sspr"> Show self-service password reset link</label>
<label>SSPR link text</label><input type="text" id="ssprText">
<label>Terms of use display text</label><input type="text" id="tou">
<label>Privacy &amp; cookies display text</label><input type="text" id="priv">
<h3>Export</h3><div class="row"><button class="pri" onclick="exportJSON()">Export JSON</button><button onclick="shot()">Download PNG</button></div>
<p style="color:#888;font-size:11px">Settings persist in localStorage. Images over the browser storage quota may not persist.</p>
</aside>
<main id="stage"><div id="scaler"><div id="page">
 <div class="bgdefault" id="bgdef"></div><div id="hdr"></div>
 <div id="wrap"><div class="card" id="card"></div></div>
 <div id="ftr"><span id="ftou">Terms of use</span><span id="fpriv">Privacy &amp; cookies</span><span>...</span></div>
</div></div><div id="vplabel"></div></main>

 const dk=S.sqMode==='dark',sq=S.img[dk?'sqDark':'sqLight'];
 const pt=S.ptext?`<div class="ptext">${md(S.ptext)}</div>`:'';const em=esc(S.email||'user@contoso.com');
 const c=$('card');
 if(S.step==='1'){c.innerHTML=`${banner}<div class="title">Sign in</div><input class="ms-in" id="email" placeholder="${esc(S.hint)}" value="${esc(S.email)}">${S.sspr?`<a class="lnk" href="#">${esc(S.ssprText)}</a>`:''}<div class="btns"><button class="btn p" id="next">Next</button></div>${pt}`;
  $('email').oninput=e=>{S.email=e.target.value;save()};$('next').onclick=()=>{S.step='2';$('step').value='2';render()}}
 else{c.innerHTML=`${banner}<div class="ident"><span class="bk" id="back">←</span>${em}</div><div class="title">Enter password</div><input class="ms-in" type="password" placeholder="Password">${S.sspr?'<a class="lnk" href="#">Forgot my password</a>':''}<div class="btns"><button class="btn p">Sign in</button></div><div class="tile" style="background:${dk?'#1b1b1b':'#fff'};color:${dk?'#fff':'#1b1b1b'}">${sq?`<img src="${sq}" alt="">`:'<div class="ph"></div>'}<div><div style="font-weight:600">${em}</div><div style="font-size:12px;opacity:.7">Square logo (${S.sqMode}) on account tile</div></div></div>${pt}`;
  $('back').onclick=()=>{S.step='1';$('step').value='1';render()}}
 save();fit()}
function fit(){const st=$('stage'),pg=$('page');const W=pg.offsetWidth,H=pg.offsetHeight;const s=Math.min((st.clientWidth-40)/W,(st.clientHeight-40)/H,1);const sc=$('scaler');sc.style.transform=`translate(${-W*s/2}px,${-H*s/2}px) scale(${s})`;$('vplabel').textContent=`${W}×${H} @ ${Math.round(s*100)}%`}
function exportJSON(){const o={};ids.forEach(i=>o[i]=S[i]);o.assets=S.meta;o.signInPageTextLength=S.ptext.length;o.textIsDraft=!!S.drafts;dl(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),'entra-branding-settings.json')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function shot(){const pg=$('page');const w=pg.offsetWidth,h=pg.offsetHeight;const css=[...document.styleSheets].map(s=>[...s.cssRules].map(r=>r.cssText).join('')).join('');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${new XMLSerializer().serializeToString(pg)}</div></foreignObject></svg>`;
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);try{c.toBlob(b=>b?dl(b,'entra-preview.png'):alert('Export blocked; use an OS screenshot.'))}catch(e){alert('Browser blocked canvas export; use an OS screenshot.')}};im.onerror=()=>alert('Screenshot failed; use an OS screenshot.');im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
window.onresize=fit;buildUploads();bind();render();
